name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm run build

  release:
    # On version tags: build the AppImage/.deb once and publish to GitHub
    # Releases (the app's auto-updater reads GitHub latest-linux.yml).
    # Mirrors .gitea/workflows/ci.yml (which also publishes to the Gitea
    # instance's release). Both pipelines may run for the same tag; the
    # gh release create/upload pair is idempotent via --clobber.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: dist
        # --publish never: publish explicitly in the next step. electron-builder
        # would otherwise try to auto-publish to its configured github provider.
        run: pnpm run build && pnpm exec electron-builder --linux --publish never

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/termsprawl-*.AppImage dist/termsprawl_*_amd64.deb dist/latest-linux.yml 2>/dev/null \
          || gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/termsprawl-*.AppImage dist/termsprawl_*_amd64.deb dist/latest-linux.yml
          echo "github release $TAG published"
