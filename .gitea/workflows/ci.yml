name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install relay deps
        # Relay tests import `ws` from relay/package.json. They only passed
        # historically because `ws` happened to be a root dependency; install
        # the relay workspace explicitly so that coincidence can't break CI.
        run: pnpm --dir relay install --frozen-lockfile

      # The renderer vite build peaks ~2 GB of JS heap; Node's default limit
      # (~2 GB on the runner) aborts it mid-build (exit 134, "heap out of
      # memory"). Raise the ceiling for all steps on the 8 GB runner CT.
      - name: raise node heap limit
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> "$GITHUB_ENV"

      # Canonical gate list lives in scripts/verify.sh (package.json "verify"):
      # typecheck -> desktop build -> Server build -> release-safety checks ->
      # vitest. Do not expand the gate list here — edit scripts/verify.sh so CI
      # and local runs can never drift apart. Both builds must precede the
      # suite: src/server/server-boot-gate.test.ts GETs '/' and asserts the
      # served renderer shell, which only exists after `pnpm run build`.
      - name: verify
        run: pnpm run verify

  release:
    needs: verify
    # On version tags: build the AppImage/.deb once, publish to BOTH the Gitea
    # release (this instance) and GitHub Releases (the app's auto-updater reads
    # GitHub latest-linux.yml). CI runs on Gitea; GitHub only receives the
    # published artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install
        run: pnpm install --frozen-lockfile

      # Same heap raise for the release job (dist runs electron-builder after
      # the vite build).
      - name: raise node heap limit
        run: echo "NODE_OPTIONS=--max-old-space-size=4096" >> "$GITHUB_ENV"

      - name: require GitHub publishing credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: test -n "$GH_TOKEN" || { echo "GH_TOKEN is required for desktop auto-updates" >&2; exit 1; }

      - name: dist
        # --publish never: electron-builder would otherwise auto-publish to
        # the configured github provider on tag builds (fails without
        # GH_TOKEN). The publish steps below upload to Gitea + GitHub.
        run: pnpm run build && pnpm exec electron-builder --linux --publish never

      - name: write release notes
        # Sourced from CHANGELOG.md for this exact version; the helper prints an
        # explicit fallback (and warns) if no entry exists, so the release notes
        # are never an empty page. A section that exists but is empty is a hard
        # error — the version must record its changes.
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          node scripts/release-notes.mjs "$version" > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md

      - name: generate release checksums
        # SHA256SUMS covers the AppImage, the .deb, and the updater manifest.
        # The script itself gates on the primary artifacts being present and
        # non-empty, so checksums can never be generated over a partial release.
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          bash scripts/release-checksums.sh dist "$version"

      - name: verify release artifacts
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          for f in "dist/termsprawl-${version}.AppImage" "dist/termsprawl_${version}_amd64.deb" dist/latest-linux.yml dist/SHA256SUMS; do
            test -s "$f" || { echo "Missing or empty release artifact: $f" >&2; exit 1; }
          done

      - name: publish gitea release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$(cat dist/RELEASE_NOTES.md)"
          test -n "$notes" || { echo "release notes are empty" >&2; exit 1; }
          # Create the release (idempotent: reuse if it already exists, and
          # refresh its notes so a retried run republishes the same body).
          api="${GITEA_URL}/api/v1/repos/${REPO}/releases"
          body="$(jq -nc --arg tag "$TAG" --arg notes "$notes" '{tag_name:$tag, name:$tag, body:$notes, draft:false, prerelease:false}')"
          resp="$(curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
            -d "${body}" "${api}" 2>/dev/null || true)"
          if [[ -z "${resp}" || "${resp}" == *"already exists"* ]]; then
            resp="$(curl -fsS -H "Authorization: token ${TOKEN}" "${api}/tags/${TAG}")"
            rel_id="$(printf '%s' "${resp}" | jq -r '.id')"
            curl -fsS -X PATCH -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg notes "$notes" '{body:$notes}')" "${api}/${rel_id}"
          fi
          rel_id="$(printf '%s' "${resp}" | jq -r '.id')"
          echo "gitea release id: ${rel_id}"

          for f in dist/termsprawl-*.AppImage dist/termsprawl_*_amd64.deb dist/latest-linux.yml dist/SHA256SUMS dist/RELEASE_NOTES.md; do
            [[ -s "$f" ]] || { echo "Missing or empty artifact: $f" >&2; exit 1; }
            name="$(basename "$f")"
            echo "gitea uploading ${name}"
            curl -fsS -X POST \
              -H "Authorization: token ${TOKEN}" \
              -F "attachment=@${f}" \
              "${api}/${rel_id}/assets?name=${name}" >/dev/null
          done
          echo "gitea release ${TAG} published"

      - name: publish github release
        # GitHub Releases still feed the desktop app's auto-updater
        # (latest-linux.yml). GitHub *Actions* are permanently disabled on the
        # account — that's about the CI runner, not this publish step, which
        # runs on Gitea's runner with a required PAT secret and is how releases
        # land on GitHub.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: dazeb/termsprawl
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GH_TOKEN not set — GitHub release is required." >&2
            exit 1
          fi
          test -s dist/RELEASE_NOTES.md || { echo "release notes are empty" >&2; exit 1; }
          echo "creating/updating GitHub release ${TAG}"
          # Idempotent retry: create on the first run; on a rerun where the
          # release already exists, refresh the notes and re-upload assets.
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "${TAG}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/termsprawl-*.AppImage dist/termsprawl_*_amd64.deb dist/latest-linux.yml dist/SHA256SUMS \
          || {
            gh release edit "${TAG}" --repo "${REPO}" --notes-file dist/RELEASE_NOTES.md
            gh release upload "${TAG}" \
              --repo "${REPO}" \
              --clobber \
              dist/termsprawl-*.AppImage dist/termsprawl_*_amd64.deb dist/latest-linux.yml dist/SHA256SUMS
          }
          echo "github release ${TAG} published"
